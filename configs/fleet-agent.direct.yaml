host: 0.0.0.0
port: 8001
workspace: /root/yahboomcar_ros2_ws/yahboomcar_ws
data_dir: /root/peacekeeper-car/data

control:
  backend: rosmaster
  rosmaster_port: /dev/myserial
  rosmaster_speed: 25
  direct_deadband: 0.01
  direct_motion_mode: motion
  manual_override_s: 0.8

# Copy show assets into /root/peacekeeper-car/data/audio/ and play them through
# the Mission API. The agent deliberately never accepts arbitrary host paths.
audio:
  enabled: true
  player_command: ffplay
  asset_dir: /root/peacekeeper-car/data/audio
  max_asset_bytes: 67108864

# Direct, car-side conversation. Enable after placing the KWS model files and
# setting mission_api_url. The shared token is injected from the environment.
voice:
  enabled: false
  auto_start: true
  robot_id: car_1
  mission_api_url: ""
  input_device: null
  output_device: null
  wake_phrase: 你好
  stop_phrase: 停止
  kws_model_dir: /root/peacekeeper-car/models/kws
  silence_ms: 800
  max_utterance_s: 15
  followup_timeout_s: 20
  # Pre-provision this fixed Mandarin prompt under audio.asset_dir.
  local_error_asset: voice-service-error.wav

ros:
  distro_setup: /opt/ros/foxy/setup.bash
  workspace_setup: /root/yahboomcar_ros2_ws/yahboomcar_ws/install/setup.bash
  cmd_vel_topic: /cmd_vel
  scan_topic: /scan
  map_topic: /map
  odom_topic: /odom
  odom_frame: odom
  base_frame: base_footprint
  base_link_frame: base_link
  camera_frame: camera_link
  publish_odom: true
  publish_tf: true
  odom_period_s: 0.05
  odom_linear_x_scale: 1.0
  odom_linear_y_scale: 1.0
  odom_angular_z_scale: 1.0
  mock_cmd_vel: false

safety:
  default_ttl_ms: 500
  watchdog_period_s: 0.1
  max_linear_x: 0.45
  max_linear_y: 0.45
  max_angular_z: 1.4

video:
  device: 0
  width: 640
  height: 480
  fps: 20

# Enable only after the Jetson-local engine and vision runtime are deployed.
vision:
  enabled: true
  engine_path: /root/peacekeeper-car/models/yolov8n.engine
  confidence: 0.4
  imgsz: 640
  target_labels:
    - cat
  worker_url: http://127.0.0.1:8092
  worker_timeout_s: 20.0
  monitor_fps: 2.0
  stream_fps: 5.0

hazards:
  enabled: true
  confidence: 0.5
  confirmation_window: 5
  confirmation_hits: 3
  stop_distance_m: 1.5
  clear_after_s: 10
  cooldown_s: 30
  evidence_max_bytes: 2147483648
  robot_id: car_1
  # Set this to the Mission API address reachable from the car before deployment.
  mission_api_url: ""
  mission_api_token: ""
  # Upload this file through Web Console or copy it into audio.asset_dir.
  alarm_audio_asset: cat-alert.mp3
  alarm_audio_volume: 100
  alarm_audio_loop: true

processes:
  chassis:
    name: chassis-disabled-in-direct-mode
    command: python3 -c "import time; time.sleep(3600)"
    auto_start: false
  lidar:
    name: lidar
    command: bash -lc 'ros2 launch sllidar_ros2 sllidar_launch.py & ros2 run tf2_ros static_transform_publisher -0.0455 5.258E-05 0.3059 3.14 0 0 base_link laser & wait'
    auto_start: true
  laser_tracker:
    name: laser_tracker
    command: ros2 run icar_laser laser_Tracker_a1_X3
    auto_start: false
  slam:
    name: slam
    command: ros2 launch slam_gmapping slam_gmapping.launch.py
    auto_start: false

mapping:
  saver_command: ros2 run nav2_map_server map_saver_cli -f {map_path} --ros-args -p save_map_timeout:=120000

patrol:
  routes_file: /root/peacekeeper-car/configs/patrol_routes.yaml
  goal_timeout_s: 180
  cancel_timeout_s: 5
  poll_period_s: 0.2

security:
  require_token: true
  shared_token: "yuyu_233"
  max_map_bytes: 67108864
