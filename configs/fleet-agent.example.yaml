host: 0.0.0.0
port: 8001
workspace: /root/yahboomcar_ros2_ws/yahboomcar_ws
data_dir: /root/peacekeeper-car/data

ros:
  distro_setup: /opt/ros/foxy/setup.bash
  workspace_setup: /root/yahboomcar_ros2_ws/yahboomcar_ws/install/setup.bash
  cmd_vel_topic: /cmd_vel
  scan_topic: /scan
  map_topic: /map

safety:
  default_ttl_ms: 500
  watchdog_period_s: 0.1
  max_linear_x: 0.45
  max_linear_y: 0.45
  max_angular_z: 1.4

video:
  device: 0
  width: 640
  height: 480
  fps: 20

processes:
  chassis:
    name: chassis
    command: ros2 run yahboomcar_bringup Mcnamu_driver_X3
    auto_start: false
  lidar:
    name: lidar
    command: ros2 launch sllidar_ros2 sllidar_launch.py
    auto_start: false
  slam:
    name: slam
    command: ros2 run yahboomcar_nav slam_gmapping_X3
    auto_start: false

mapping:
  saver_command: ros2 run nav2_map_server map_saver_cli -f {map_path}
