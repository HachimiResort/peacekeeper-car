name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mission-api:
    runs-on: ubuntu-latest
    env:
      PEACEKEEPER_SHARED_TOKEN: ci-shared-token
      PEACEKEEPER_CARS_FILE: ${{ github.workspace }}/configs/fleet/cars.yaml
      PEACEKEEPER_MAP_STORAGE_DIR: ${{ github.workspace }}/.ci/peacekeeper-maps
    defaults:
      run:
        shell: bash
        working-directory: apps/mission-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/mission-api/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run backend tests
        run: |
          mkdir -p "$PEACEKEEPER_MAP_STORAGE_DIR"
          python -m pytest -q

      - name: Run lightweight backend packaging checks
        run: |
          python -m compileall mission_api migrations
          docker build -t peacekeeper/mission-api:${{ github.sha }} .

  web-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/web-console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web-console/package-lock.json
            apps/web-console/tools/openapi/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci
          npm --prefix tools/openapi ci

      - name: Run frontend checks
        run: |
          npm run generate:api
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  openapi-contract:
    runs-on: ubuntu-latest
    env:
      PEACEKEEPER_SHARED_TOKEN: ci-shared-token
      PEACEKEEPER_CARS_FILE: ${{ github.workspace }}/configs/fleet/cars.yaml
      PEACEKEEPER_MAP_STORAGE_DIR: ${{ github.workspace }}/.ci/peacekeeper-maps
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/mission-api/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web-console/package-lock.json
            apps/web-console/tools/openapi/package-lock.json

      - name: Install contract generation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/mission-api"
          npm --prefix apps/web-console ci
          npm --prefix apps/web-console/tools/openapi ci

      - name: Regenerate checked-in contracts
        shell: bash
        run: |
          mkdir -p "$PEACEKEEPER_MAP_STORAGE_DIR"
          python apps/mission-api/tools/export_openapi.py
          npm --prefix apps/web-console run generate:api

      - name: Ensure generated API artifacts are committed
        shell: bash
        run: git diff --exit-code -- apps/mission-api/openapi.json apps/web-console/src/api/generated.ts

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: peacekeeper
      POSTGRES_USER: peacekeeper
      POSTGRES_PASSWORD: ci-postgres-password
      PEACEKEEPER_SHARED_TOKEN: ci-shared-token
      STATUS_POLL_S: "1.0"
      STATUS_TIMEOUT_S: "2.0"
      WEB_CONSOLE_DEMO_MODE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write CI env file
        shell: bash
        run: |
          {
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "PEACEKEEPER_SHARED_TOKEN=$PEACEKEEPER_SHARED_TOKEN"
            echo "STATUS_POLL_S=$STATUS_POLL_S"
            echo "STATUS_TIMEOUT_S=$STATUS_TIMEOUT_S"
            echo "WEB_CONSOLE_DEMO_MODE=$WEB_CONSOLE_DEMO_MODE"
          } > .env.ci

      - name: Build and start compose stack
        shell: bash
        run: docker compose --env-file .env.ci -f compose.yaml up -d --build

      - name: Wait for Mission API readiness
        shell: bash
        run: timeout 180 bash -c 'until curl -fsS http://127.0.0.1:28080/health/ready > /dev/null; do sleep 3; done'

      - name: Wait for Web Console readiness
        shell: bash
        run: timeout 120 bash -c 'until curl -fsS http://127.0.0.1:28081/ > /dev/null; do sleep 3; done'

      - name: Dump compose logs on failure
        if: failure()
        shell: bash
        run: docker compose --env-file .env.ci -f compose.yaml logs --no-color

      - name: Tear down compose stack
        if: always()
        shell: bash
        run: docker compose --env-file .env.ci -f compose.yaml down -v
