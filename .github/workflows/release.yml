name: Release Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: crpi-1kkkjpeehkoxqf8e.cn-shanghai.personal.cr.aliyuncs.com
      NAMESPACE: ${{ secrets.ALIYUN_DOCKER_HUB_NAMESPACE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_HUB_USER }}
          password: ${{ secrets.ALIYUN_DOCKER_HUB_TOKEN }}

      - name: Build and push mission-api image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/mission-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/peacekeeper-mission-api:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/peacekeeper-mission-api:main
          cache-from: type=gha,scope=mission-api
          cache-to: type=gha,scope=mission-api,mode=max

      - name: Build and push web-console image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-console
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/peacekeeper-web-console:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/peacekeeper-web-console:main
          cache-from: type=gha,scope=web-console
          cache-to: type=gha,scope=web-console,mode=max
