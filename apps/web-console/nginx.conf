server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Maps and audio are authenticated multipart uploads, not tiny JSON control calls.
  # Keep this aligned with the 64 MiB map limit enforced by Mission API.
  client_max_body_size 64m;

  location ~ ^/api/robots/[^/]+/video/stream\.mjpg$ {
    proxy_pass http://mission-api:8080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/robots/[^/]+/vision/stream\.mjpg$ {
    proxy_pass http://mission-api:8080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://mission-api:8080;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://mission-api:8080;
    proxy_set_header Host $host;
  }

  location /ws/ {
    proxy_pass http://mission-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_hide_header Date;
    proxy_read_timeout 75s;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
